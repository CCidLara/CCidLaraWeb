    <style>
        body {
            background: #f8f7f4; /* Soft paper white */
        }
        .photo-masonry {
            margin: 40px auto;
            max-width: 1600px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            background: transparent;
            padding: 0;
        }
        .photo-masonry-item {
            width: 16.6666%;
            margin: 4px;
            background: none;
            border-radius: 0;
            overflow: hidden;
            box-shadow: none;
            transition: transform 0.4s cubic-bezier(.4,0,.2,1);
            display: flex;
        }
        .photo-masonry-item img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
            transition: transform 0.2s;
            border: none;
            box-shadow: none;
            background: #f8f7f4;
        }
        .photo-masonry-item img:hover {
            transform: scale(1.03);
        }
        @media (max-width: 1400px) {
            .photo-masonry-item { width: 20%; }
        }
        @media (max-width: 1200px) {
            .photo-masonry-item { width: 25%; }
        }
        @media (max-width: 900px) {
            .photo-masonry-item { width: 33.3333%; }
        }
        @media (max-width: 700px) {
            .photo-masonry-item { width: 50%; }
        }
        @media (max-width: 500px) {
            .photo-masonry-item { width: 100%; }
        }
    </style>
