<!DOCTYPE html>
<html>
<head>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&display=swap');

  body {
    background-color: #f0f0f0;
    font-family: 'Montserrat', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px;
    gap: 40px;
  }

  .card-container {
    width: 3.5in;
    height: 2in;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    position: relative;
    overflow: hidden;
  }

  /* FRONT SIDE */
  .front {
    background-image: url('bg_tarjeta.png'); /* Conceptually linking your image */
    background-size: cover;
    background-position: center;
    color: white;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    /* Simulate the image provided by user with a gradient overlay */
    background: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,0.2) 40%, rgba(0,0,0,0.95) 100%), url('https://i.ibb.co/6RJ4J7s/bg-tarjeta-placeholder.jpg'); 
    background-size: cover;
    background-position: center;
  }

  .content-area {
    padding: 20px 25px;
  }

  .name {
    font-size: 16px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 5px;
  }

  .accent-line {
    width: 50px;
    height: 3px;
    background-color: #B71C1C; /* Deep Red */
    margin-bottom: 8px;
  }

  .title-primary {
    font-size: 10px;
    font-weight: 500;
    margin-bottom: 2px;
  }

  .title-secondary {
    font-size: 9px;
    font-weight: 300;
    color: #cccccc;
    margin-bottom: 12px;
  }

  .contact {
    font-size: 8px;
    font-weight: 300;
    opacity: 0.9;
    letter-spacing: 0.5px;
  }

  /* BACK SIDE */
  .back {
    background-color: #111;
    display: flex;
    justify-content: space-evenly;
    align-items: center;
    flex-direction: row; /* Side by side logos */
  }

  .logo-area {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40%;
    height: 60%;
    border: 1px dashed rgba(255,255,255,0.1); /* Placeholder border */
    color: white;
    font-size: 10px;
    text-align: center;
  }
  
  .uchile {
      /* Simulating the UChile Logo provided */
      background-image: url('escudo-uchile-vertical-blanco.png'); 
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
  }

  .austral {
      /* Simulating the Austral Games Logo provided */
      background-image: url('logo_blanco.png');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
  }

</style>
</head>
<body>

  <div class="card-container front">
    <div class="content-area">
      <div class="name">Christofer Cid Lara</div>
      <div class="accent-line"></div>
      <div class="title-primary">Image & Data Science Researcher</div>
      <div class="title-secondary">Technical Artist | Photographer</div>
      <div class="contact">chris.cid.lara@gmail.com &nbsp;|&nbsp; www.ccidlara.com</div>
    </div>
  </div>

  <div class="card-container back">
    <div class="logo-area uchile">
        <span style="opacity:0.3">UChile<br>Logo Here</span>
    </div>
    <div style="height: 40px; width: 1px; background-color: #333;"></div>
    <div class="logo-area austral">
        <span style="opacity:0.3">Austral<br>Logo Here</span>
    </div>
  </div>

</body>
</html>
